[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "git-visualizer"
version = "0.1.0"
description = "Projektor-taugliche Live View eines echten git-Repositorys für Vorlesungen"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sven Feyerabend", email = "Sven.Feyerabend@t-online.de" }]
keywords = ["git", "visualization", "teaching", "lecture", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
git-visualizer = "git_visualizer.app:main"
git-visualizer-demo = "git_visualizer.lecture_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
