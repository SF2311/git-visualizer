[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-visualizer"
version = "0.1.0"
description = "Projektor-taugliche Live View eines echten git-Repositorys für Vorlesungen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
git-visualizer = "git_visualizer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
